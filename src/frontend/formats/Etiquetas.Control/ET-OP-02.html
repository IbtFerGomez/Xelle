<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ET-OP-02 - Fuera de Servicio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .etiqueta-container {
            width: 100mm;
            height: 100mm;
            background-color: #ffffff;
            border: 4px solid #991b1b;
            padding: 5mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 5px;
        }

        .logo-area svg {
            width: 30px;
            height: 30px;
            vertical-align: middle;
        }

        .logo-text {
            font-size: 12px;
            font-weight: bold;
            vertical-align: middle;
            margin-left: 5px;
            color: #1D1D1B;
        }

        .titulo-alerta {
            text-align: center;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin: 0 0 2px 0;
            background-color: #991b1b;
            color: #ffffff;
            padding: 6px;
            border: 1px solid #991b1b;
        }

        .subtitulo {
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            margin-top: 4px;
            color: #991b1b;
            text-transform: uppercase;
        }

        .advertencia-critica {
            font-size: 9px;
            font-weight: bold;
            text-align: center;
            margin: 8px 0;
            color: #991b1b;
            border: 1px dashed #991b1b;
            padding: 4px;
            background-color: #fff8f8;
        }

        .campo {
            display: flex;
            align-items: flex-end;
            margin-bottom: 10px;
            font-size: 10px;
        }

        .campo label {
            font-weight: bold;
            white-space: nowrap;
            margin-right: 5px;
        }

        .linea {
            flex-grow: 1;
            border-bottom: 1px solid #000;
            height: 14px;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            font-size: 9px;
            margin-bottom: 10px;
            padding: 5px;
            border: 1px solid #ccc;
        }

        .footer-bottom {
            margin-top: 5px;
            font-size: 8px;
            text-align: center;
            color: #777;
            border-top: 1px solid #ccc;
            padding-top: 4px;
        }

        @media print {
            @page { margin: 0; }
            body { margin: 0; padding: 0; background: #fff; }
            .etiqueta-container { border: 4px solid #991b1b; }
        }
    </style>
</head>
<body>
    <div class="etiqueta-container">
        <div>
            <div class="logo-area">
                <svg viewBox="10 10 80 80" xmlns="http://www.w3.org/2000/svg">
                    <g>
                        <circle fill="#2E9D82" cx="25" cy="25" r="13" />
                        <circle fill="#2E9D82" cx="75" cy="75" r="13" />
                        <path fill="#2E9D82"
                            d="M 15.81,65.81 C 28.54,53.08 33.74,59.19 46.46,46.46 C 59.19,33.74 53.08,28.54 65.81,15.81 A 13 13 0 1 1 84.19,34.19 C 71.46,46.92 66.26,40.81 53.54,53.54 C 40.81,66.26 46.92,71.46 34.19,84.19 A 13 13 0 1 1 15.81,65.81 Z" />
                    </g>
                </svg>
                <span class="logo-text">XELLE SCIENTIFIC</span>
            </div>
            <div class="titulo-alerta">🛑 FUERA DE SERVICIO</div>
            <div class="subtitulo">ESTADO CRÍTICO</div>
            <div class="advertencia-critica">PROHIBIDO SU USO EN PRODUCCIÓN / CALIDAD</div>

            <div class="campo"><label>ID del Equipo:</label>
                <div class="linea"></div>
            </div>

            <div style="font-weight: bold; font-size: 9px; margin-bottom: 3px;">Motivo del Bloqueo:</div>
            <div class="checkbox-grid">
                <span>[ ] Falla</span>
                <span>[ ] Mantenimiento</span>
                <span>[ ] Vencido</span>
                <span>[ ] OOT (Fuera Tol.)</span>
            </div>

            <div class="campo"><label>Fecha de Bloqueo:</label>
                <div class="linea" style="text-align:center;">//____</div>
            </div>

            <div class="campo"><label>Reporte Desviación:</label>
                <div class="linea"></div>
            </div>
        </div>

        <div>
            <div class="campo"><label>Firma Bloqueo (QA):</label>
                <div class="linea"></div>
            </div>
            <div class="footer-bottom">Código: ET-OP-02 | Versión: 1.0 | Vigencia: MAR 2026 | RETIRO SOLO POR CALIDAD</div>
        </div>
    </div>
</body>
</html>
