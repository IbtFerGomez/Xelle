<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ET-OP-01 - Equipo Calibrado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .etiqueta-container {
            width: 100mm;
            height: 100mm;
            background-color: #ffffff;
            border: 2px solid #166534;
            padding: 5mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 5px;
        }

        .logo-area svg {
            width: 30px;
            height: 30px;
            vertical-align: middle;
        }

        .logo-text {
            font-size: 12px;
            font-weight: bold;
            vertical-align: middle;
            margin-left: 5px;
            color: #1D1D1B;
        }

        .titulo-alerta {
            text-align: center;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin: 0 0 2px 0;
            background-color: #166534;
            color: #ffffff;
            padding: 6px;
            border: 1px solid #166534;
            text-transform: uppercase;
        }

        .subtitulo {
            text-align: center;
            font-size: 10px;
            font-weight: bold;
            margin-top: 4px;
            margin-bottom: 12px;
            color: #166534;
        }

        .campo {
            display: flex;
            align-items: flex-end;
            margin-bottom: 12px;
            font-size: 10px;
        }

        .campo label {
            font-weight: bold;
            white-space: nowrap;
            margin-right: 5px;
        }

        .linea {
            flex-grow: 1;
            border-bottom: 1px solid #000;
            height: 14px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            font-size: 10px;
            margin-left: 5px;
        }

        .footer-bottom {
            margin-top: 5px;
            font-size: 8px;
            text-align: center;
            color: #777;
            border-top: 1px solid #ccc;
            padding-top: 4px;
        }

        @media print {
            @page { margin: 0; }
            body { margin: 0; padding: 0; background: #fff; }
            .etiqueta-container { border: 2px solid #166534; }
        }
    </style>
</head>
<body>
    <div class="etiqueta-container">
        <div>
            <div class="logo-area">
                <svg viewBox="10 10 80 80" xmlns="http://www.w3.org/2000/svg">
                    <g>
                        <circle fill="#2E9D82" cx="25" cy="25" r="13" />
                        <circle fill="#2E9D82" cx="75" cy="75" r="13" />
                        <path fill="#2E9D82"
                            d="M 15.81,65.81 C 28.54,53.08 33.74,59.19 46.46,46.46 C 59.19,33.74 53.08,28.54 65.81,15.81 A 13 13 0 1 1 84.19,34.19 C 71.46,46.92 66.26,40.81 53.54,53.54 C 40.81,66.26 46.92,71.46 34.19,84.19 A 13 13 0 1 1 15.81,65.81 Z" />
                    </g>
                </svg>
                <span class="logo-text">XELLE SCIENTIFIC</span>
            </div>
            <div class="titulo-alerta">✅ EQUIPO CALIBRADO / VERIFICADO</div>
            <div class="subtitulo">CONTROL DE METROLOGÍA</div>

            <div class="campo"><label>ID del Equipo:</label>
                <div class="linea"></div>
            </div>
            
            <div class="campo"><label>Fecha de Calibración:</label>
                <div class="linea" style="text-align:center;">//____</div>
            </div>

            <div class="campo"><label>Próxima Calibración:</label>
                <div class="linea" style="text-align:center;">//____</div>
            </div>

            <div class="campo">
                <label>Realizado por:</label>
                <div class="checkbox-group">
                    <span>[ ] Interno</span>
                    <span>[ ] Externo: __________</span>
                </div>
            </div>
        </div>

        <div>
            <div class="campo"><label>Firma Responsable:</label>
                <div class="linea"></div>
            </div>
            <div class="footer-bottom">Código: ET-OP-01 | Versión: 1.0 | Vigencia: MAR 2026 | NO REMOVER DEL EQUIPO</div>
        </div>
    </div>
</body>
</html>
