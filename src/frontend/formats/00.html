<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FO-SGC-04 Listado Maestro de Formatos</title>
    <link rel="stylesheet" href="format-styles.css">
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        @page { size: portrait; margin: 1cm; }
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { width: 19cm; margin: 0 auto; background: white; padding: 0.8cm; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); }
        .section-header { background-color: #1E3A5F; color: #fff; padding: 6px 10px; font-weight: bold; font-size: 11px; margin-top: 14px; margin-bottom: 10px; border-radius: 4px; text-transform: uppercase; }
        .compact-table { width: 100%; border-collapse: collapse; font-size: 9px; }
        .compact-table th { background-color: #1E3A5F; color: #fff; font-size: 9px; padding: 6px; text-align: center; border: 1px solid #cbd5e1; }
        .compact-table td { padding: 4px; border: 1px solid #cbd5e1; text-align: center; vertical-align: middle; }
        .text-left { text-align: left !important; padding-left: 5px !important; }
        .group-header { background-color: #f1f5f9; color: #1E3A5F; font-weight: bold; text-align: left !important; padding-left: 10px !important; }
        .footer-unified { margin-top: 20px; border-top: 2px solid #1E3A5F; padding-top: 8px; text-align: center; font-size: 9px; color: #475569; }
        @media print { .no-print { display: none !important; } body{background: white;} .container{box-shadow:none; width:100%;} }
    </style>
</head>
<body id="doc-fo-sgc-04">
    <div class="global-controls no-print" style="position:fixed; right:20px; top:20px; display:flex; flex-direction:column; gap:10px;">
        <button onclick="window.print()" style="padding:10px; background:#1E3A5F; color:white; border:none; border-radius:5px; cursor:pointer;">Imprimir Listado</button>
    </div>

    <div class="container">
        <div style="display:flex; justify-content:space-between; border-bottom:3px solid #1E3A5F; padding-bottom:10px;">
            <svg viewBox="0 0 320 80" style="width: 200px;">
                <circle fill="#2E9D82" cx="25" cy="25" r="13" /><circle fill="#2E9D82" cx="75" cy="75" r="13" />
                <path fill="#2E9D82" d="M15.8,65.8C28.5,53.1 33.7,59.2 46.5,46.5C59.2,33.7 53.1,28.5 65.8,15.8A13 13 0 1 1 84.2,34.2C71.5,46.9 66.3,40.8 53.5,53.5C40.8,66.3 46.9,71.5 34.2,84.2A13 13 0 1 1 15.8,65.8Z" />
                <text x="90" y="42" style="font-family:Arial Black; font-weight:900; fill:#1E3A5F;" font-size="34">XELLE</text>
                <text x="91" y="68" style="font-family:Arial; font-weight:700; fill:#1E3A5F; letter-spacing: 2px;" font-size="19">SCIENTIFIC</text>
            </svg>
            <div style="text-align:right;">
                <span style="font-weight:bold; color:#1E3A5F; font-size:14px;">FO-SGC-04</span><br>
                <svg id="barcode" style="height:35px;"></svg>
            </div>
        </div>

        <div style="text-align:center; margin-top:10px;">
            <h1 style="color:#1E3A5F; font-size:16px; margin:0;">LISTADO MAESTRO DE FORMATOS DEL SGC</h1>
            <p style="font-size:10px; color:#666; margin:5px 0;">Código: FO-SGC-04 | Versión: 2.0 | Vigencia: JUN 2026</p>
        </div>

        <div class="section-header">CONTROL DOCUMENTAL EN PISO</div>
        <table class="compact-table" id="list-table">
            <thead>
                <tr>
                    <th width="15%">Código</th>
                    <th width="50%">Nombre del Formato</th>
                    <th width="15%">Versión</th>
                    <th width="20%">Vigencia</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>

        <div class="footer-unified">
            <div class="control-data">FO-SGC-04 | Listado Maestro de Formatos | Xelle Scientific | Página 1 de 1</div>
            <div class="legal-data">Prohibida su reproducción sin autorización.</div>
        </div>
    </div>

    <script>
        JsBarcode("#barcode", "FO-SGC-04", { format: "CODE128", displayValue: false, height: 30 });

        const dataList = [
            { group: "A. ADMINISTRACIÓN Y RRHH (FO-AD)", items: [
                { code: "FO-AD-00", name: "Matriz Maestra de Puestos", ver: "1.0", vig: "MAR 2026" },
                { code: "FO-AD-01", name: "Perfil y Descripción de Puesto", ver: "1.0", vig: "MAR 2026" },
                { code: "FO-AD-13", name: "Calificación de Personal", ver: "1.0", vig: "MAR 2026" }
            ]},
            { group: "B. OPERACIONES Y PRODUCCIÓN (FO-OP)", items: [
                { code: "FO-OP-15", name: "Pedido Maestro", ver: "1.0", vig: "ENE 2026" },
                { code: "FO-OP-40", name: "Orden Maestra de Producción", ver: "1.1", vig: "MAR 2026" },
                { code: "FO-OP-51", name: "Producto No Conforme (Desviaciones)", ver: "1.0", vig: "ENE 2026" },
                { code: "FO-OP-54", name: "Reporte de Desviación de Procesos", ver: "2.0", vig: "MAR 2026" }
            ]},
            { group: "C. LABORATORIO Y CALIDAD OPERATIVA (FO-LC)", items: [
                { code: "FO-LC-16", name: "Certificado Liberación Línea Celular", ver: "3.0", vig: "MAR 2026" },
                { code: "FO-LC-21", name: "Bitácora de Cultivo Celular", ver: "1.0", vig: "ENE 2026" },
                { code: "FO-LC-48", name: "Resultados y Dictamen de Lote", ver: "1.0", vig: "ENE 2026" },
                { code: "FO-LC-50", name: "Manifiesto de Destrucción RPBI", ver: "1.0", vig: "ENE 2026" }
            ]},
            { group: "D. ASEGURAMIENTO DE CALIDAD Y SGC (FO-QA / FO-SGC)", items: [
                { code: "FO-QA-02", name: "Listas de Verificación de Auditoría", ver: "1.0", vig: "ENE 2026" },
                { code: "FO-QA-09", name: "Reporte CAPA - AMFE", ver: "1.0", vig: "ENE 2026" },
                { code: "FO-SGC-05", name: "Índice Maestro de PNOs", ver: "1.0", vig: "MAY 2026" },
                { code: "FO-SGC-06", name: "Índice Maestro de Políticas", ver: "1.0", vig: "JUN 2026" }
            ]}
        ];

        const tbody = document.querySelector("#list-table tbody");
        dataList.forEach(group => {
            const trGroup = document.createElement("tr");
            trGroup.innerHTML = `<td colspan="4" class="group-header">${group.group}</td>`;
            tbody.appendChild(trGroup);
            
            group.items.forEach(doc => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="font-weight:bold; color:#1E3A5F;">${doc.code}</td>
                    <td class="text-left">${doc.name}</td>
                    <td>${doc.ver}</td>
                    <td>${doc.vig}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
